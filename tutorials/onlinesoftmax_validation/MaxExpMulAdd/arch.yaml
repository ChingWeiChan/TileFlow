architecture: 
  version: 0.2 

  subtree:
  - name: System
    local: 
    - name: MainMemory
      class: DRAM
      attributes:
        block-size: 30000
        depth: 256
        word-bits: 4
        read_bandwidth: 400

    subtree: 
    - name: GlobalBuffer
      local:
      - name: GlobalBuffer
        class: SRAM
        attributes:
          word-bits: 8
          block-size: 256
          depth: 100
          read_bandwidth: 600
          write_bandwidth: 600
      subtree:
      - name : OnlineSoftmaxUnit
        local:
          - name: RegFile[0..255]
            class: regfile
            attributes:
              meshX: 256
              depth: 256
              block-size: 80
              word-bits: 16
              read_bandwidth: 400
              write_bandwidth: 400
          - name: MaxExpMulAddUnit[0..255]
            class: compute
            attributes:
              word-bits: 16