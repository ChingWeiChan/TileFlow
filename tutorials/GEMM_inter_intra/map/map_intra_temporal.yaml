mapping:
  node-type: Scope 
  type: Sequential
  subtree:
  - node-type: Tile 
    type: temporal 
    factors: M=X L=X W=X
    target: MainMemory
    subtree: 
    - node-type: Tile 
      type: temporal 
      factors: M=X L=X W=X
      target: GlobalBuffer
      subtree: 
      - node-type: Tile 
        type: temporal  
        factors: M=X L=X W=X
        target: RegFile
        subtree:
        - node-type: Op
          name: GEMM1


  - node-type: Tile 
    type: temporal 
    factors: K=X N=X Z=X
    target: MainMemory
    subtree: 
    - node-type: Tile 
      type: temporal 
      factors: K=X N=X Z=X
      target: GlobalBuffer
      subtree: 
      - node-type: Tile 
        type: temporal  
        factors: K=X N=X Z=X
        target: RegFile
        subtree:
        - node-type: Op
          name: GEMM2

  - node-type: Tile 
    type: temporal 
    factors: P=X Q=X Y=X
    target: MainMemory
    subtree: 
    - node-type: Tile 
      type: temporal 
      factors: P=X Q=X Y=X
      target: GlobalBuffer
      subtree: 
      - node-type: Tile 
        type: temporal  
        factors: P=X Q=X Y=X
        target: RegFile
        subtree:
        - node-type: Op
          name: GEMM3

output: GEMM_temporal
verbose: 1
        