architecture: 
  version: 0.2 

  subtree:
  - name: System
    
    local: 
    - name: MainMemory
      class: DRAM 
      attributes:
        sizeKB: 10485760
        word-bits: 16
        # read_bandwidth: 4.3
        # write_bandwidth: 2.9
      
    subtree: 
    - name: GlobalBuffer 
      local:  
      - name: GlobalBuffer
        class: SRAM
        attributes:
          word-bits: 16
          sizeKB: 163840
          # read_bandwidth: 52
          # write_bandwidth: 20 


      subtree:
      - name: macPE_1
        local: 
        - name: RegFile[0..255] 
          class: regfile
          attributes:
            meshX: 16
            meshY: 16
            block_size: 3
            word-bits: 16
            depth: 256
            read_bandwidth: 3.2
            write_bandwidth: 3.2

        - name: mac[0..255]
          class: intmac 
          attributes: 
            word-bits: 16
            meshX: 16
            meshY: 16