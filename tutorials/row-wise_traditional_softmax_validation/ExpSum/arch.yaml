architecture: 
  version: 0.2 

  subtree:
  - name: System
    
    local: 
    - name: MainMemory
      class: DRAM
      attributes:
        block-size: 30000
        depth: 256
        word-bits: 4
        read_bandwidth: 200


    subtree: 
    - name: GlobalBuffer
      local:
      - name: GlobalBuffer
        class: SRAM
        attributes:
          word-bits: 8
          block-size: 8000
          depth: 256
          # capacity = depth x block-size x word-bits 
          read_bandwidth: 300
          write_bandwidth: 300

      subtree:
      - name : SoftmaxUnit
        local:
          - name: RegFile[0..255]
            class: regfile
            attributes:
              meshX: 256
              depth: 10
              block-size: 800
              word-bits: 16
              read_bandwidth: 400
              write_bandwidth: 400

          - name: ExpSumUnit[0..255]
            class: compute
            attributes:
              word-bits: 16