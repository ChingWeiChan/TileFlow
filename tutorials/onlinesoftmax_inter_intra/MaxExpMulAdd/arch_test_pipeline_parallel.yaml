architecture: 
  version: 0.2 

  subtree:
  - name: System
    
    local: 
    - name: MainMemory
      class: DRAM
      attributes:
        block-size: 30000
        depth: 256000
        word-bits: 16
        read_bandwidth: 30


    subtree: 
    - name: GlobalBuffer
      local:
      - name: GlobalBuffer
        class: SRAM
        attributes:
          word-bits: 16
          block-size: 30000
          depth: 128000
          read_bandwidth: 45
          write_bandwidth: 45
      subtree:
      - name : MaxExpMulAddUnit
        local:
          - name: RegFile[0..255]
            class: regfile
            attributes:
              meshX: 256
              depth: 640000
              block-size: 30000
              word-bits: 16
              read_bandwidth: 100
              write_bandwidth: 100
          - name: MaxExpMulAddUnit[0..255]
            class: compute
            attributes:
              word-bits: 16