architecture: 
  version: 0.2 

  subtree:
  - name: System
    
    local: 
    - name: MainMemory
      class: DRAM
      attributes:
        block-size: 300000
        depth: 256
        word-bits: 4
        write_bandwidth: 200
    subtree: 
    - name: GlobalBuffer
      local:
      - name: GlobalBuffer
        class: SRAM
        attributes:
          word-bits: 8
          block-size: 256
          depth: 1
          # read_bandwidth: 300
          write_bandwidth: 300
      subtree:
      - name : softmaxUnit
        local:
          - name: RegFile[0..255]
            class: regfile
            attributes:
              meshX: 256
              depth: 256
              block-size: 80
              word-bits: 16
              # read_bandwidth: 500
              write_bandwidth: 500

          - name: DivUnit[0..255]
            class: compute
            attributes:
              word-bits: 16